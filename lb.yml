server:
  host: "0.0.0.0"
  port: ":8080"

logging:
  enabled: false
  level: "info"
  format: "json"
  output: "stdout"

rate_limiter:
  enabled: false
  type: "token_bucket"
  rate: 100
  burst: 200


virtual_hosts:

  - host: "static"

    static:
      enabled: true
      directory: "./public"
      path: "/static"

  - host: "example.com"

    health_check:
      enabled: true
      path: "/health"
      interval: 10
      timeout: 5
      max_failures: 3

    routes:
      - name: "api"
        path: "/api"
        strategy: "round_robin"
        circuit_breaker: true
        strip: "/api"

        backends:
          - name: "api-1"
            url: "http://localhost:8081"
            weight: 1

          - name: "api-2"
            url: "http://localhost:8082"
            weight: 1

      - name: "admin"
        path: "/admin"
        method: "GET"
        strategy: "round_robin"
        circuit_breaker: true

        backends:
          - name: "admin-1"
            url: "http://localhost:8083"
            weight: 1
